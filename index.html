  function isoDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

  function renderDashboard(){const today=summarize(byDate(todayISO())),month=summarize(byMonth(todayISO().slice(0,7)));let latest=sortByDate(db.transactions).slice(0,5),cnt={visits:db.visits.filter(x=>x.date===todayISO()).length,bookings:db.bookings.filter(x=>x.date===todayISO()&&x.status!=='cancelled').length,appointments:db.appointments.filter(x=>x.date===todayISO()&&x.status!=='cancelled').length,pending:db.bookings.filter(x=>x.status==='pending').length};let days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-6+i);let date=isoDate(d);return {d:date,s:summarize(byDate(date))}}),max=Math.max(1,...days.flatMap(x=>[x.s.income,x.s.expense]));let methodRows=methods.map(m=>{let all=byMonth(todayISO().slice(0,7)).filter(x=>x.method===m),s=summarize(all);return `<div class="method-row"><span><i class="method-dot" style="background:${methodColors[m]}"></i>${safe(m)}</span><span>${money(s.income)} <span class="muted">/</span> ${money(s.expense)}</span></div>`}).join('');return `<section class="hero"><span class="overline">✦ YOUR BUSINESS AT A GLANCE</span><h2>Daily Astrology Business</h2><p>နေ့စဉ် ငွေစာရင်း၊ Customer၊ Booking၊ ရက်ချိန်းနှင့် ပစ္စည်းစာရင်းများကို တစ်နေရာတည်းမှာ စီမံနိုင်ပါသည်။</p><div class="hero-actions"><button class="btn" data-action="open-add" data-kind="customers">＋ Customer</button><button class="btn secondary" data-action="tab" data-tab="reports">လစဉ် အရှုံး/အမြတ်</button><button class="btn secondary" data-action="share-app">↗ App မျှဝေမည်</button></div></section>

  function transactionTable(arr){return `<div class="table-wrap"><table><thead><tr><th>နေ့ / အချိန်</th><th>အမျိုးအစား</th><th>အမည် / အကြောင်းအရာ</th><th>Payment</th><th class="amount">ပမာဏ</th><th></th></tr></thead><tbody>${arr.length?arr.map(r=>`<tr><td>${dateView(r.date)}<span class="sub">${safe(r.time||'')}</span></td><td><span class="pill ${r.type==='income'?'green':'red'}">${r.type==='income'?'ဝင်ငွေ':'ထွက်ငွေ'}</span><span class="sub">${safe(r.category||'')}</span></td><td>${contactCell(r.person,r.phone)}<span class="sub">${safe(r.details||'')}</span></td><td>${safe(r.method||'—')}</td><td class="amount ${r.type==='income'?'positive':'negative'}">${r.type==='income'?'+':'−'}${cash(r.amount)}</td><td>${buttonActions('transactions',r)}</td></tr>`).join(''):noRows(6)}</tbody></table></div>`}
  function renderTransactions(){let list=sortByDate(db.transactions.filter(x=>(!filterDate||x.date===filterDate)&&(txType==='all'||x.type===txType))),s=summarize(list);return `${heading('ဝင်ငွေ / ထွက်ငွေ စာရင်း',addButton('transactions')+catAddButton('income','＋ ဝင်ငွေအမျိုးအစား')+catAddButton('expense','＋ ထွက်ငွေအမျိုးအစား'))}<div class="filter-row"><input class="field-input" aria-label="ရက်စွဲ ရွေးချယ်ရန်" type="date" id="tx-date" value="${safe(filterDate)}"><button class="btn small outline" data-action="all-dates">ရက်အားလုံး</button><select class="field-select" id="tx-type" aria-label="အမျိုးအစား"><option value="all" ${txType==='all'?'selected':''}>အားလုံး</option><option value="income" ${txType==='income'?'selected':''}>ဝင်ငွေ</option><option value="expense" ${txType==='expense'?'selected':''}>ထွက်ငွေ</option></select></div><div class="grid kpis"><div class="card kpi"><div class="klabel">ရွေးထားသော ဝင်ငွေ</div><div class="value positive">${cash(s.income)} <span class="unit">Ks</span></div></div><div class="card kpi"><div class="klabel">ရွေးထားသော ထွက်ငွေ</div><div class="value negative">${cash(s.expense)} <span class="unit">Ks</span></div></div><div class="card kpi profit"><div class="klabel">အသားတင်</div><div class="value ${s.profit>=0?'positive':'negative'}">${cash(s.profit)} <span class="unit">Ks</span></div></div></div>${heading('စာရင်းသွင်းထားသော အချက်အလက်',`<span class="muted" style="font-size:11px">${list.length} စာရင်း</span>`)}${transactionTable(list)}<p class="small-note">* ရက်စွဲနှင့် Filter ပြောင်းလျှင် ကိန်းဂဏန်းများ အလိုအလျောက် ပြောင်းလဲတွက်ချက်ပါမည်။</p>`}
  function renderVisits(){let list=sortByDate(db.visits);return `${heading('လူစာရင်း အဝင် / အထွက်',addButton('visits'))}<div class="notice">ဝင်ချိန် / ထွက်ချိန်ကို ကိုယ်တိုင်သွင်းနိုင်ပြီး၊ “ယခု ထွက်” ကိုနှိပ်လျှင် လက်ရှိအချိန်ဖြင့် အလိုအလျောက် မှတ်တမ်းတင်ပါမည်။</div>${heading('လာရောက်သူ မှတ်တမ်း')}<div class="table-wrap"><table><thead><tr><th>နေ့ရက်</th><th>အမည် / ဖုန်း</th><th>အဝင်</th><th>အထွက်</th><th>လာရောက်ရခြင်း</th><th></th></tr></thead><tbody>${list.length?list.map(r=>`<tr><td>${dateView(r.date)}</td><td>${contactCell(r.person,r.phone)}<span class="sub">${safe([r.gender,r.age ? r.age+' နှစ်':'',r.dob?dateView(r.dob):''].filter(Boolean).join(' • '))}</span></td><td>${safe(r.timeIn||'—')}</td><td>${safe(r.timeOut||'—')}</td><td>${safe(r.purpose||'—')}<span class="sub">${safe(r.note||'')}</span></td><td><div class="actions">${!r.timeOut?`<button class="btn small mint" data-action="checkout" data-id="${safe(r.id)}">ယခု ထွက်</button>`:''}${buttonActions('visits',r)}</div></td></tr>`).join(''):noRows(6)}</tbody></table></div>`}
  function paidOf(bookingId){return db.transactions.filter(t=>t.bookingId===bookingId&&t.type==='income').reduce((s,t)=>s+number(t.amount),0)}
  function renderBookings(){let list=sortByDate(db.bookings);return `${heading('Booking စာရင်း',addButton('bookings'))}<div class="notice">Booking ဖန်တီးခြင်းသည် ဝင်ငွေမဟုတ်သေးပါ။ “ငွေလက်ခံ” မှ အမှန်တကယ် ရရှိသည့်ငွေကို သွင်းမှသာ ဝင်ငွေစာရင်းထဲ ပါဝင်ပါမည်။</div>${heading('Booking အချက်အလက်')}<div class="table-wrap"><table><thead><tr><th>နေ့ / အချိန်</th><th>Customer</th><th>ဝန်ဆောင်မှု</th><th>အခကြေးငွေ</th><th>ငွေလက်ခံပြီး</th><th>အခြေအနေ</th><th></th></tr></thead><tbody>${list.length?list.map(r=>{let paid=paidOf(r.id),due=number(r.fee)-paid;return `<tr><td>${dateView(r.date)}<span class="sub">${safe(r.time||'')}</span></td><td>${safe(r.person)}<span class="sub">${safe(r.phone||'')}</span></td><td>${safe(r.service||'—')}<span class="sub">${safe(r.notes||'')}</span></td><td class="amount">${money(r.fee)}</td><td class="amount">${money(paid)}<span class="sub">ကျန် ${money(Math.max(0,due))}</span></td><td>${badge(r.status)}</td><td><div class="actions"><button class="btn small mint" data-action="book-pay" data-id="${safe(r.id)}" ${r.status==='cancelled'||(number(r.fee)>0&&due<=0)?'disabled':''}>ငွေလက်ခံ</button>${buttonActions('bookings',r)}</div></td></tr>`}).join(''):noRows(7)}</tbody></table></div>`}
  function renderAppointments(){let list=sortByDate(db.appointments);return `${heading('ရက်ချိန်း မှတ်တမ်း',addButton('appointments')+catAddButton('appointments','＋ ရက်ချိန်းအမျိုးအစား'))}<div class="table-wrap"><table><thead><tr><th>ရက် / အချိန်</th><th>အမည်</th><th>အကြောင်းအရာ</th><th>အခြေအနေ</th><th>မှတ်ချက်</th><th></th></tr></thead><tbody>${list.length?list.map(r=>`<tr><td>${dateView(r.date)}<span class="sub">${safe(r.time||'')}</span></td><td>${safe(r.person)}<span class="sub">${safe(r.phone||'')}</span></td><td>${safe(r.subject||'—')}</td><td>${badge(r.status)}</td><td>${safe(r.note||'—')}</td><td>${buttonActions('appointments',r)}</td></tr>`).join(''):noRows(6)}</tbody></table></div>`}
  function stockEntries(){let map=new Map();for(const r of [...db.items].sort((a,b)=>(a.date||'').localeCompare(b.date||''))){let key=(r.name||'').trim().toLocaleLowerCase()+'|'+(r.unit||'');let v=map.get(key)||{name:r.name,unit:r.unit,count:0};v.count+=(r.movement==='in'?1:-1)*number(r.qty);map.set(key,v)}return Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name))}
  function renderItems(){let list=sortByDate(db.items),stocks=stockEntries();return `${heading('အထွေထွေ ပစ္စည်းစာရင်း',addButton('items')+catAddButton('items','＋ ပစ္စည်းအမျိုးအစား'))}<div class="notice warning">ပစ္စည်းဝယ်ယူမှု၏ ငွေကုန်ကျစရိတ်ကို “ငွေစာရင်း → ထွက်ငွေ” တွင် သီးသန့်မှတ်တမ်းသွင်းပါ။ ဤနေရာသည် ပစ္စည်း အရေအတွက်အတွက်သာ ဖြစ်ပြီး ငွေစာရင်းကို နှစ်ခါမတွက်ပါ။</div>${heading('ပစ္စည်း လက်ကျန်')}<div class="stock-grid">${stocks.length?stocks.map(s=>`<div class="stock-item"><b>${safe(s.name)}</b><strong class="${s.count<0?'negative':''}">${cash(s.count)}</strong><small>${safe(s.unit||'ခု')} လက်ကျန်</small></div>`).join(''):'<div class="small-note">ပစ္စည်းစာရင်း မရှိသေးပါ။</div>'}</div>${heading('အဝင် / အထွက် မှတ်တမ်း')}<div class="table-wrap"><table><thead><tr><th>နေ့ရက်</th><th>ပစ္စည်းအမည်</th><th>အဝင် / အထွက်</th><th>အရေအတွက်</th><th>မှတ်ချက်</th><th></th></tr></thead><tbody>${list.length?list.map(r=>`<tr><td>${dateView(r.date)}</td><td>${safe(r.name)}</td><td>${badge(r.movement)}</td><td><b>${r.movement==='in'?'+':'−'}${cash(r.qty)} ${safe(r.unit||'ခု')}</b></td><td>${safe(r.note||'—')}</td><td>${buttonActions('items',r)}</td></tr>`).join(''):noRows(6)}</tbody></table></div>`}
  function renderReports(){let rows=byMonth(filterMonth),s=summarize(rows),total=summarize(db.transactions),daily=new Map(),cats=new Map();for(const r of rows){let d=daily.get(r.date)||{date:r.date,income:0,expense:0};d[r.type]+=number(r.amount);daily.set(r.date,d);let key=(r.type==='income'?'ဝင်ငွေ • ':'ထွက်ငွေ • ')+(r.category||'အခြား');cats.set(key,(cats.get(key)||0)+number(r.amount))}return `${heading('လအလိုက် အစီရင်ခံစာ',`<button class="btn small outline" data-action="print">⎙ Print / PDF</button>`)}<div class="filter-row"><label for="report-month" class="small-note">လ ရွေးပါ</label><input class="field-input" type="month" id="report-month" value="${safe(filterMonth)}"><button class="btn small mint" data-action="export-csv">CSV စာရင်း Export</button><button class="btn small outline" data-action="save-month-report">↓ လကုန်အရှုံး/အမြတ် Save</button></div><div class="grid kpis"><div class="card kpi"><div class="klabel">${safe(filterMonth)} · ဝင်ငွေ</div><div class="value positive">${cash(s.income)} <span class="unit">Ks</span></div></div><div class="card kpi"><div class="klabel">ထွက်ငွေ</div><div class="value negative">${cash(s.expense)} <span class="unit">Ks</span></div></div><div class="card kpi profit"><div class="klabel">လစဉ် အမြတ် / အသားတင်</div><div class="value ${s.profit>=0?'positive':'negative'}">${cash(s.profit)} <span class="unit">Ks</span></div></div></div>${heading('နေ့အလိုက် ဝင်ငွေ / ထွက်ငွေ')}<div class="table-wrap"><table class="summary-table"><thead><tr><th>ရက်စွဲ</th><th class="amount">ဝင်ငွေ</th><th class="amount">ထွက်ငွေ</th><th class="amount">လက်ကျန်</th></tr></thead><tbody>${daily.size?[...daily.values()].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${dateView(x.date)}</td><td class="amount positive">${money(x.income)}</td><td class="amount negative">${money(x.expense)}</td><td class="amount ${x.income-x.expense>=0?'positive':'negative'}">${signed(x.income-x.expense)}</td></tr>`).join(''):noRows(4)}</tbody></table></div>${heading(   function renderSettings(){return `${heading('အခြားသူများကို App ပေးသုံးရန်')}<div class="card" style="background:linear-gradient(120deg,#f5eeff,#fff3fa);border:1px solid #e4d9ff"><h3 class="panel-title">↗ Daily Astrology Business — Share App</h3><p class="small-note">အောက်က Link ကို Messenger၊ Viber၊ Telegram၊ WhatsApp မှာပို့ပါ။ လက်ခံသူက Chrome မှာဖွင့်ပြီး Add to Home screen / Install လုပ်နိုင်ပါသည်။</p><div class="quick"><button type="button" class="btn mint" data-action="share-app">↗ App Link ပို့မည်</button><button type="button" class="btn outline" data-action="copy-app-link">⧉ Link ကူးမည်</button><a class="btn secondary" href="${safe(PUBLIC_APP_URL)}" target="_blank" rel="noopener noreferrer">App ဖွင့်မည်</a></div><p class="small-note" style="overflow-wrap:anywhere">${safe(PUBLIC_APP_URL)}</p><div class="notice">🔒 <b>တစ်ဦးချင်းစီ သီးသန့်စာရင်း</b> — အခြားသူများ App သုံးနိုင်သော်လည်း ကိုယ့်ဖုန်းထဲက Customer၊ ဖုန်းနံပါတ်၊ ဝင်ငွေ၊ ထွက်ငွေ အချက်အလက်များကို သူတို့ မမြင်နိုင်ပါ။ အခြားဖုန်းများအကြား စာရင်းအလိုအလျောက် Sync မဖြစ်သေးပါ။</div></div>${heading('အမျိုးအစားများ ထပ်ပေါင်းရန်')}<div class="quick">${catAddButton('appointments','＋ ရက်ချိန်း')}${catAddButton('income','＋ ဝင်ငွေ')}${catAddButton('expense','＋ ထွက်ငွေ')}${catAddButton('items','＋ ပစ္စည်း')}</div><p class="small-note">အသစ်ထည့်ထားသောအမျိုးအစားများကို သက်ဆိုင်ရာ Form ရဲ့ ရွေးချယ်စရာစာရင်းထဲမှာ တွေ့နိုင်ပါမည်။</p>${heading('Data Backup & Restore')}<div class="split"><div class="card"><h3 class="panel-title">အချက်အလက် သိမ်းဆည်းခြင်း</h3><p class="small-note">ဒေတာများကို လက်ရှိ Browser ၏ Local Storage ထဲတွင်သာ သိမ်းထားပါသည်။ ဖုန်းအသစ်၊ Browser အသစ်သို့ အလိုအလျောက် မကူးပါ။ Browser data ရှင်းလင်းလျှင် ဆုံးရှုံးနိုင်ပါသည်။</p><div class="quick"><button class="btn mint" data-action="backup">↓ JSON Backup</button><button class="btn outline" data-action="import">↑ JSON Restore</button></div><p class="small-note">အကြံပြုချက် — နေ့တိုင်း သို့မဟုတ် အပတ်စဉ် JSON Backup ကို Files / Drive ထဲမှာ သိမ်းပါ။ Restore သည် ယ   function options(vals,selected){return vals.map(v=>`<option value="${safe(v)}" ${v===selected?'selected':''}>${safe(v)}</option>`).join('')}
  function ff(label,name,type='text',value='',opts={}){let attr=`id="f-${name}" name="${name}" ${opts.required?'required':''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} ${opts.placeholder?`placeholder="${safe(opts.placeholder)}"`:''}`,input=opts.options?`<select ${attr}>${opts.options.map(z=>Array.isArray(z)?`<option value="${safe(z[0])}" ${z[0]==value?'selected':''}>${safe(z[1])}</option>`:`<option value="${safe(z)}" ${z==value?'selected':''}>${safe(z)}</option>`).join('')}</select>`:type==='textarea'?`<textarea ${attr}>${safe(value)}</textarea>`:`<input ${attr} type="${type}" value="${safe(value)}">`;return `<div class="form-field ${opts.wide?'wide':''}"><label for="f-${name}">${label}${opts.required?' *':''}</label>${input}${opts.hint?`<div class="hint">${safe(opts.hint)}</div>`:''}</div>`}

      if(db.bookings.length){let bks=[['','Booking မချိတ်ဆက်ပါ'],...db.bookings.map(b=>[b.id,`${b.person} · ${dateView(b.date)} · ${b.service||'Booking'}`])];out+=ff('ချိတ်ဆက်ထားသော Booking','bookingId','select',v.bookingId||'',{options:bks,wide:true,hint:'ငွေလက်ခံပြီးသော Booking အတွက်သာ စာရင်းချိတ်ဆက်ပါ။'});}
    }

    }

    }
    if(kind==='items'){
      out+=ff('နေ့ရက်','date','date',v.date,{required:true})+ff('ပစ္စည်းအမည်','name','select',v.name||'ဖယောင်းတိုင်',{required:true,options:groupList('items',v.name)})+inFormCatAdd('items','name')+ff('အမျိုးအစား','movement','select',v.movement,{options:[['in','အဝင် (+)'],['out','အထွက် (−)']]})+ff('အရေအတွက်','qty','number',v.qty??1,{required:true,min:1,step:'1'})+ff('ရေတွက်ယူနစ်','unit','text',v.unit||'ခု',{required:true,placeholder:'ခု / အုပ် / ပုလင်း'})+ff('မှတ်ချက်','note','textarea',v.note||'',{wide:true});

  function notice(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.classList.remove('show'),2800)}
  function onSubmit(e){e.preventDefault();if(!modalKind)return;const data=Object.fromEntries(new FormData(form).entries());for(let k in data)if(typeof data[k]==='string')data[k]=data[k].trim();if(modalKind==='transactions'){data.amount=number(data.amount);if(!Number.isSafeInteger(data.amount)||data.amount<=0){alert('ငွေပမာဏကို သုညထက်ကြီးသော ကိန်းပြည့်ဖြင့် ဖြည့်ပါ။');return}if(data.bookingId&&(!db.bookings.find(x=>x.id===data.bookingId)||data.type!=='income')){alert('Booking နှင့် ဝင်ငွေစာရင်းသာ ချိတ်ဆက်ပါ။');return}}
    if(modalKind==='customers'||modalKind==='visits'){if(data.age){data.age=number(data.age);if(!Number.isSafeInteger(data.age)||data.age<0||data.age>150){alert('အသက်ကို မှန်ကန်စွာ ဖြည့်ပါ။');return}}else if(data.dob){let n=new Date(),d=new Date(data.dob+'T12:00:00');let y=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))y--;if(y>=0&&y<=150)data.age=y}}
    if(modalKind==='bookings'){data.fee=number(data.fee);if(!Number.isSafeInteger(data.fee)||data.fee<0){alert('ကျသင့်ငွေကို သုည သို့မဟုတ် အပေါင်းကိန်းဖြင့် ဖြည့်ပါ။');return}}
    if(modalKind==='items'){data.qty=number(data.qty);if(!Number.isSafeInteger(data.qty)||data.qty<=0){alert('ပစ္စည်း အရေအတွက်ကို အပေါင်းကိန်းပြည့်ဖြင့် ဖြည့်ပါ။');return}}
    if(modalKind==='visits'&&data.timeOut&&data.timeIn&&data.timeOut<data.timeIn){if(!confirm('ထွက်ချိန်က ဝင်ချိန်ထက် စောနေပါသည်။ ညလုံးကျော်သွားသည့် အခြေအနေဖြစ်ပါသလား?'))return}
    const arr=db[modalKind],i=editId?arr.findIndex(x=>x.id===editId):-1,previous=i>=0?{...arr[i]}:null,record={...(i!==-1?arr[i]:{}),...data,id:i!==-1?editId:id()};if(i>=0)arr[i]=record;else arr.push(record);if(!save()){if(i>=0)arr[i]=previous;else arr.pop();return}closeModal();render();notice(i>=0?'ပြင်ဆင်ပြီးပါပြီ':'သိမ်းဆည်းပြီးပါပြီ')}
  function remove(kind,uid){const arr=db[kind],r=arr.find(x=>x.id===uid);if(!r)return;let extra=kind==='bookings'?'\nBooking ကို ဖျက်မည်ဖြစ်သော်လည်း ငွေစာရင်းထဲမှ လက်ခံငွေများကို မဖျက်ပါ။':'';if(!confirm('ဤမှတ်တမ်းကို ဖျက်မည်လား?'+extra))return;db[kind]=arr.filter(x=>x.id!==uid);if(kind==='bookings')for(let t of db.transactions)if(t.bookingId===uid)t.bookingId='';save();render();notice('မှတ်တမ်း ဖျက်ပြီးပါပြီ')}
  function checkout(uid){let r=db.visits.find(x=>x.id===uid);if(!r)return;r.timeOut=nowHHMM();save();render();notice('ထွက်ချိန် မှတ်တမ်းတင်ပြီးပါပြီ')}
  function bookPay(uid){let b=db.bookings.find(x=>x.id===uid);if(!b||b.status==='cancelled')return;let due=Math.max(0,number(b.fee)-paidOf(uid));openModal('transactions',null,{date:todayISO(),time:nowHHMM(),type:'income',category:'Booking / Deposit',person:b.person,phone:b.phone||'',details:`${b.service||'Booking'} · ${dateView(b.date)}`,bookingId:uid,amount:due||''})}
  function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
  function download(name,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
  function backup(){download('Daily-Astrology-Business-backup-'+todayISO()+'.json',JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json');notice('JSON Backup ထုတ်ပြီးပါပြီ')}
  function exportCSV(){let list=tab==='reports'?byMonth(filterMonth):db.transactions,heads=['Date','Time','Type','Amount_MMK','Payment_Method','Category','Customer','Customer_Phone','Details','Booking_ID'],rows=list.map(r=>[r.date,r.time,r.type,r.amount,r.method,r.category,r.person,r.phone,r.details,r.bookingId]);download(`Daily-Astrology-InCome-${tab==='reports'?filterMonth:'All'}-money.csv`,'\uFEFF'+[heads,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notice('CSV ဖိုင် ထုတ်ပြီးပါပြီ')}
  function saveMonthReport(){
    const all=sortByDate(byMonth(filterMonth)),s=summarize(all),dailies=new Map();
    for(let r of all){let x=dailies.get(r.date)||{date:r.date,income:0,expense:0};x[r.type]+=number(r.amount);dailies.set(r.date,x)}
    const tr=all.map(r=>`<tr><td>${dateView(r.date)}</td><td>${safe(r.type==='income'?'ဝင်ငွေ':'ထွက်ငွေ')}</td><td>${safe(r.category)}</td><td>${safe(r.person)}</td><td>${safe(r.method)}</td><td class="num">${money(r.amount)}</td></tr>`).join('');
    const day=[...dailies.values()].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${dateView(x.date)}</td><td class="num">${money(x.income)}</td><td class="num">${money(x.expense)}</td><td class="num">${signed(x.income-x.expense)}</td></tr>`).join('');
    let html=`<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Astrology Business ${safe(filterMonth)} အရှုံးအမြတ်</title><style>body{font-family:"Noto Sans Myanmar","Myanmar Text",sans-serif;margin:24px;color:#32275a;line-height:1.75}h1{color:#7250d6}h2{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f5efff;padding:18px;border-radius:13px}.metric b{display:block;font-size:18px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid #e4dffa;padding:8px;text-align:left}.num{text-align:right}.muted{color:#685f85;font-size:11px}@media(max-width:600px){body{margin:12px}.grid{grid-template-columns:1fr}}@media print{body{margin:12mm}}</style></head><body><h1>✦ Daily Astrology Business</h1><p>အရှုံး / အမြတ် လစဉ်အစီရင်ခံစာ · ${safe(filterMonth)}</p><div class="grid"><div class="metric">ဝင်ငွေ<b>${money(s.income)}</b></div><div class="metric">ထွက်ငွေ<b>${money(s.expense)}</b></div><div class="metric">အသားတင် ${s.profit>=0?'အမြတ်':'အရှုံး'}<b>${money(s.profit)}</b></div></div><h2>နေ့အလိုက် စာရင်း</h2><table><thead><tr><th>ရက်စွဲ</th><th>ဝင်ငွေ</th><th>ထွက်ငွေ</th><th>လက်ကျန်</th></tr></thead><tbody>${day||'<tr><td colspan="4">မှတ်တမ်းမရှိပါ</td></tr>'}</tbody></table><h2>အရောင်းအဝယ် အသေးစိတ်</h2><table><thead><tr><th>ရက်</th><th>အမျိုးအစား</th><th>အကြောင်းအရာ</th><th>အမည်</th><th>Payment</th><th>ပမာဏ</th></tr></thead><tbody>${tr||'<tr><td colspan="6">မှတ်တမ်းမရှိပါ</td></tr>'}</tbody></table><p class="muted">ဝင်ငွေ − ထွက်ငွေကိုသာ တွက်ချက်ထားသည်။ Booking ကျန်ငွေ၊ အကြွေး၊ စတော့တန်ဖိုးနှင့် အခွန်တို့ မပါဝင်ပါ။</p></body></html>`;
    download(`Daily-Astrology-Business-Profit-${filterMonth}.html`,html,'text/html;charset=utf-8');notice('လကုန်အရှုံး/အမြတ် HTML ဖိုင် သိမ်းပြီးပါပြီ')
  }
  function validateImport(d){if(!d||typeof d!=='object')return false;return ['transactions','visits','bookings','appointments','items'].every(k=>Array.isArray(d[k])&&d[k].every(x=>x&&typeof x==='object'&&!Array.isArray(x))) }
  async function importFile(f){if(!f)return;try{if(f.size>12*1024*1024)throw Error('Backup ဖိုင် 12MB ထက်ကြီးနေပါသည်။');let data=JSON.parse(await f.text());if(!validateImport(data))throw Error('မှန်ကန်သော Daily Astrology Business Backup မဟုတ်ပါ။');if(!confirm(`Backup Restore ပြုလုပ်မည်လား?\nလက်ရှိဒေတာ အားလုံးကို အစားထိုးပါမည်။\nငွေစာရင်း ${data.transactions.length} ခု၊ Booking ${data.bookings.length} ခု ပါဝင်သည်။`))return;db={...emptyDB(),...Object.fromEntries(['transactions','visits','bookings','appointments','items','customers'].map(k=>[k,Array.isArray(data[k])?data[k]:[]])),categories:{...emptyDB().categories,...Object.fromEntries(['appointments','income','expense','items'].map(k=>[k,Array.isArray(data.categories?.[k])?data.categories[k]:[]]))}};save();render();notice('Backup ပြန်သွင်းပြီးပါပြီ')}catch(e){alert('Restore မအောင်မြင်ပါ။ '+e.message)}finally{document.getElementById('import-file').value=''}}
  async function copyAppLink(){
    try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(PUBLIC_APP_URL);notice('App Link ကူးပြီးပါပြီ');return}}
    catch(e){}
    let el=document.createElement('textarea');el.value=PUBLIC_APP_URL;el.setAttribute('readonly','');el.style.position='fixed';el.style.left='-10000px';document.body.appendChild(el);el.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}el.remove();
    if(ok){notice('App Link ကူးပြီးပါပြီ')}else{prompt('ဒီ App Link ကို Copy ကူးပြီး ပို့ပါ။',PUBLIC_APP_URL)}
  }
  async function shareApp(){
    if(navigator.share){try{await navigator.share({title:'Daily Astrology Business',text:'နေ့စဉ်ငွေဝင်/ငွေထွက်၊ Booking၊ Customer၊ ရက်ချိန်းနှင့် လစဉ်အရှုံးအမြတ် App ကို ဒီ Link ကနေ သုံးနိုင်ပါတယ်။',url:PUBLIC_APP_URL});return}catch(e){if(e?.name==='AbortError')return}}
    await copyAppLink()
  }
  function addCategory(group,target=''){
    if(!['appointments','income','expense','items'].includes(group))return;
    let labels={appointments:'ရက်ချိန်း',income:'ဝင်ငွေ',expense:'ထွက်ငွေ',items:'ပစ္စည်း'};
    let label=prompt(`${labels[group]} အမျိုးအစားအသစ် အမည်ရေးပါ။`);
    if(label===null)return;label=label.trim().replace(/\s+/g,' ');
    if(!label||label.length>70){alert('အမျိုးအစားအမည်ကို စာလုံး ၁ လုံးမှ ၇၀ လုံးအတွင်း ဖြည့်ပါ။');return}
    let all=groupList(group);
    if(!all.includes(label)){db.categories[group].push(label);if(!save()){db.categories[group].pop();return}}
    if(target&&modal.classList.contains('show')){
      let el=form.querySelector(`#f-${target}`);if(el){if(![...el.options].some(o=>o.value===label))el.add(new Option(label,label));el.value=label}
      notice('အမျိုးအစားအသစ် ထည့်ပြီးပါပြီ')
    }else{render();notice('အမျိုးအစားအသစ် ထည့်ပြီးပါပြီ')}
  }
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,k=btn.dataset.kind,uid=btn.dataset.id;if(a==='tab')setTab(btn.dataset.tab);else if(a==='open-add')openModal(k);else if(a==='close-modal')closeModal();else if(a==='edit'){let r=db[k]?.find(x=>x.id===uid);if(r)openModal(k,r)}else if(a==='delete')remove(k,uid);else if(a==='checkout')checkout(uid);else if(a==='book-pay')bookPay(uid);else if(a==='payment-filter'){paymentFilter=btn.dataset.method;render()}else if(a==='add-payment')openModal('transactions',null,{type:'income',method:btn.dataset.method||'Cash'});else if(a==='add-category')addCategory(btn.dataset.group,btn.dataset.target);else if(a==='save-month-report')saveMonthReport();else if(a==='share-app')shareApp();else if(a==='copy-app-link')copyAppLink();else if(a==='all-dates'){filterDate='';render()}else if(a==='backup')backup();else if(a==='import')document.getElementById('import-file').click();else if(a==='export-csv')exportCSV();else if(a==='print')window.print();else if(a==='reset'){if(confirm('လက်ရှိ ဒေတာအားလုံးကို ဖျက်မည်လား? Backup ယူထားပါ။')&&confirm('သေချာပါသလား? ပြန်ယူ၍မရနိုင်ပါ။')){db=emptyDB();save();render();notice('ဒေတာအားလုံး ဖျက်ပြီးပါပြီ')}}});
  document.addEventListener('change',e=>{if(e.target.id==='f-type'&&modalKind==='transactions'){let type=e.target.value,cat=document.getElementById('f-category'),catAdd=form.querySelector('[data-action=add-category]');if(cat){let opts=groupList(type==='expense'?'expense':'income');cat.innerHTML=opts.map(z=>`<option value="${safe(z)}">${safe(z)}</option>`).join('');}if(catAdd)catAdd.dataset.group=type==='expense'?'expense':'income'}else if(e.target.id==='f-dob'&&['customers','visits'].includes(modalKind)){let inp=form.querySelector('#f-age');if(inp&&!inp.value&&e.target.value){let n=new Date(),d=new Date(e.target.value+'T12:00:00');let y=n.getFullYear()-d.getFullYear()-(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())?1:0);if(y>=0&&y<=150)inp.value=y}}else if(e.target.id==='tx-date'){filterDate=e.target.value;render()}else if(e.target.id==='tx-type'){txType=e.target.value;render()}else if(e.target.id==='report-month'){filterMonth=e.target.value||todayISO().slice(0,7);render()}});
  form.addEventListener('submit',onSubmit);document.getElementById('import-file').addEventListener('change',e=>importFile(e.target.files?.[0]));modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))closeModal()});window.addEventListener('storage',e=>{if(e.key===DB_KEY){db=loadDB();render()}});window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);if(tabs.some(x=>x[0]===h)&&h!==tab){tab=h;render()}});
  const h=location.hash.slice(1);if(tabs.some(x=>x[0]===h))tab=h;render();
  if('serviceWorker'in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
})();
</script>
