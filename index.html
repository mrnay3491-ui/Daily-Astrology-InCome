    .app{max-width:1230px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--navy);color:white;padding:29px 18px;min-height:100dvh;position:sticky;top:0;align-self:start;max-height:100dvh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;margin:0 5px 36px}.brand img{width:45px;height:45px;border-radius:13px}.brand strong{font-size:18px;line-height:1.2;display:block}.brand small{font-size:10px;opacity:.65;letter-spacing:1.8px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#bbd0d4;text-align:left;border-radius:11px;padding:12px 12px;display:flex;align-items:center;gap:11px;font-size:13px}.nav button.active{background:#335362;color:#fff;font-weight:700}.nav button:hover{background:#2b4858;color:white}.nav .sym{width:22px;text-align:center;font-size:18px}.sidebar-foot{font-size:11px;color:#9ab2b8;margin:30px 14px 10px;line-height:1.9}

    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:15px;background:white}table{border-collapse:collapse;width:100%;font-size:12px;min-width:620px}th{text-align:left;background:#f8faf9;color:#718088;font-weight:700;font-size:11px;padding:12px 15px;white-space:nowrap}td{padding:12px 15px;border-top:1px solid #eef1ef;vertical-align:middle}td .sub{font-size:10px;color:var(--secondary);display:block;margin-top:2px}td.amount{text-align:right;font-family:system-ui,sans-serif;font-weight:800;white-space:nowrap}th.amount{text-align:right}.pill{display:inline-block;padding:4px 9px;border-radius:99px;font-size:10px;background:#eef1f2;color:#596a71;white-space:nowrap}.pill.green{background:var(--mintL);color:#147c67}.pill.red{background:var(--redL);color:var(--red)}.pill.amber{background:var(--amberL);color:#886019}.actions{display:flex;gap:5px;justify-content:flex-end}td:last-child{white-space:nowrap}.empty{text-align:center;color:var(--secondary);padding:39px 15px!important;font-size:12px}.empty-icon{display:block;font-size:29px;margin-bottom:9px}
    .filter-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0 15px}.field-select,.field-input{min-height:39px;padding:8px 10px;background:white;border:1px solid #d7e1db;border-radius:10px;color:var(--ink);max-width:100%;outline:0}.field-select:focus,.field-input:focus,.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(23,137,118,.1)}.notice{border-radius:12px;padding:12px 14px;background:#edf5f1;color:#416457;font-size:12px;line-height:1.8}.notice.warning{background:#fff4e5;color:#8a652e}.small-note{font-size:11px;color:var(--secondary);line-height:1.8}.quick{display:flex;gap:9px;flex-wrap:wrap}.summary-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.summary-mini{border:1px solid var(--border);border-radius:12px;background:#fff;padding:16px}.summary-mini strong{display:block;font-family:system-ui;font-size:21px}.summary-mini span{display:block;font-size:11px;color:var(--secondary);margin-top:5px}
    .modal-overlay{position:fixed;inset:0;background:rgba(7,26,32,.56);z-index:40;display:none;align-items:center;justify-content:center;padding:15px}.modal-overlay.show{display:flex}.dialog{background:white;width:min(620px,100%);max-height:min(90dvh,900px);display:flex;flex-direction:column;border-radius:22px;overflow:hidden;box-shadow:0 24px 80px rgba(6,27,32,.2)}.dialog-top{display:flex;justify-content:space-between;align-items:center;padding:19px 22px;border-bottom:1px solid var(--border)}.dialog-top h2{margin:0;font-size:17px}.close{border:0;background:#f0f3f1;font-size:20px;border-radius:9px;height:33px;width:33px}.dialog form{overflow-y:auto;padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-field{min-width:0}.form-field.wide{grid-column:1/-1}.form-field label{font-size:12px;display:block;margin-bottom:6px;font-weight:700}.form-field input,.form-field select,.form-field textarea{display:block;border:1px solid #d8e3dc;background:white;border-radius:10px;outline:0;padding:10px 12px;width:100%;min-height:43px;color:var(--ink);font-size:13px}.form-field textarea{min-height:85px;resize:vertical}.form-actions{display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:20px;padding-top:17px}.hint{color:var(--secondary);font-size:10px;margin-top:4px}

    .toast{position:fixed;bottom:27px;right:25px;padding:12px 17px;background:#183f35;color:white;z-index:99;border-radius:12px;box-shadow:0 8px 26px #1233;font-size:12px;display:none}.toast.show{display:block}.footer{margin-top:25px;font-size:11px;color:#7c898e;text-align:center}.mobile-nav{display:none}
    @media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:22px 17px 115px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);height:calc(68px + env(safe-area-inset-bottom));padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:20;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;box-shadow:0 -4px 20px #1221}.mobile-nav::-webkit-scrollbar{display:none}.mobile-nav button{border:0;background:transparent;color:#71838b;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 62px;padding:5px 2px;min-width:62px}.mobile-nav button.active{color:var(--mint);font-weight:800}.mobile-nav .sym{font-size:21px}.topbar h1{font-size:24px}}
    @media(max-width:600px){.topbar{align-items:stretch;flex-direction:column;margin-bottom:19px}.top-actions{justify-content:space-between}.grid.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid.kpis .profit{grid-column:1/-1}.card{padding:16px}.kpi .value{font-size:22px}.split{grid-template-columns:1fr}.summary-list{grid-template-columns:repeat(2,minmax(0,1fr))}.report-box{grid-template-columns:1fr}.stock-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{align-items:flex-start}.form-grid{grid-template-columns:1fr}.form-field.wide{grid-column:auto}.dialog form{padding:16px}.dialog-top{padding:16px}.chip{font-size:10px}.filter-row{gap:6px}.field-input,.field-select{flex:1;min-width:0}.bars{height:135px}.bar-stack{height:107px}}
    @media print{.sidebar,.mobile-nav,.top-actions,.quick,.actions,.filter-row .btn,.btn,.footer{display:none!important}.app{display:block}.main{padding:0}.card,.table-wrap{box-shadow:none}body{background:white}.section-head{margin-top:17px}}

<body>
<div class="app">
  <aside class="sidebar">

  <div class="dialog"><div class="dialog-top"><h2 id="dialog-title"></h2><button type="button" class="close" data-action="close-modal" aria-label="ပိတ်">×</button></div><form id="entry-form"></form></div>
</div>

<input type="file" id="import-file" accept=".json,application/json" hidden>
<script>
(()=>{'use strict';
  const DB_KEY='daily-astrology-income-v1';
  const tabs=[['dashboard','▦','အကျဉ်းချုပ်','Dashboard'],['transactions','⇄','ငွေစာရင်း','Money'],['visits','♧','လူအဝင်အထွက်','Visitors'],['bookings','▤','Booking','Bookings'],['appointments','◷','ရက်ချိန်း','Appointments'],['items','◈','ပစ္စည်းများ','Items'],['reports','▥','အစီရင်ခံစာ','Reports'],['settings','⚙','Setting','Settings']];
  const methods=['Cash','KPay','Wave','AYA Pay'];
  const methodColors={Cash:'#a0adad',KPay:'#e25f6a',Wave:'#e6b146','AYA Pay':'#6f91bd'};
  const statusMap={pending:'စောင့်ဆိုင်း',confirmed:'အတည်ပြု',completed:'ပြီးဆုံး',cancelled:'ဖျက်သိမ်း',scheduled:'ချိန်းဆိုပြီး',done:'ပြီးဆုံး',in:'ဝင်',out:'ထွက်'};
  const nav=document.getElementById('desktop-nav'),mobileNav=document.getElementById('mobile-nav'),content=document.getElementById('content'),modal=document.getElementById('modal'),form=document.getElementById('entry-form');
  let db=loadDB(),tab='dashboard',filterDate=todayISO(),filterMonth=todayISO().slice(0,7),txType='all',modalKind='',editId=null,formPrefill={};
  function emptyDB(){return {version:1,transactions:[],visits:[],bookings:[],appointments:[],items:[]}}
  function loadDB(){try{let x=JSON.parse(localStorage.getItem(DB_KEY));if(x&&typeof x==='object'){const d=emptyDB();for(const k of ['transactions','visits','bookings','appointments','items'])d[k]=Array.isArray(x[k])?x[k]:[];return d}}catch(e){console.error(e)}return emptyDB()}
  function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}catch(e){alert('Storage မလုံလောက်ပါ။ Backup Export ယူပြီး ဖုန်း Storage ကို စစ်ဆေးပါ။');return false}}
  function isoDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
  function todayISO(){return isoDate()}
  function nowHHMM(){let d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
  function id(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
  function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function number(v){const n=Number(v);return Number.isFinite(n)?n:0}
  function cash(v){return Math.round(number(v)).toLocaleString('en-US')}
  function money(v){return cash(v)+' Ks'}
  function signed(v){return (v>=0?'+':'−')+money(Math.abs(v))}
  function dateView(s){if(!s)return '—';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
  function summarize(list){const income=list.filter(t=>t.type==='income').reduce((s,t)=>s+number(t.amount),0),expense=list.filter(t=>t.type==='expense').reduce((s,t)=>s+number(t.amount),0);return {income,expense,profit:income-expense}}
  function byDate(d){return db.transactions.filter(x=>x.date===d)}
  function byMonth(m){return db.transactions.filter(x=>(x.date||'').startsWith(m))}
  function sortByDate(list){return [...list].sort((a,b)=>((b.date||'')+' '+(b.time||'')).localeCompare((a.date||'')+' '+(a.time||'')))}
  function badge(s){let color=['confirmed','completed','done'].includes(s)?'green':s==='cancelled'?'red':s==='pending'?'amber':'';return `<span class="pill ${color}">${safe(statusMap[s]||s||'—')}</span>`}
  function noRows(n=6){return `<tr><td colspan="${n}" class="empty"><span class="empty-icon">✦</span>မှတ်တမ်း မရှိသေးပါ။ “＋ အသစ်ထည့်” ကိုနှိပ်ပြီး စတင်ပါ။</td></tr>`}
  function heading(text,right=''){return `<div class="section-head"><h2>${text}</h2><div class="right">${right}</div></div>`}
  function addButton(kind,label='＋ အသစ်ထည့်'){return `<button class="btn mint" data-action="open-add" data-kind="${kind}">${label}</button>`}
  function buttonActions(kind,r){return `<div class="actions"><button class="btn small secondary" data-action="edit" data-kind="${kind}" data-id="${safe(r.id)}">ပြင်</button><button class="btn small outline" data-action="delete" data-kind="${kind}" data-id="${safe(r.id)}">ဖျက်</button></div>`}
  function setTab(name){tab=tabs.find(x=>x[0]===name)?name:'dashboard';history.replaceState(null,'','#'+tab);render();window.scrollTo(0,0)}
  function renderNav(){nav.innerHTML=tabs.map(([key,ic,label])=>`<button data-action="tab" data-tab="${key}" class="${tab===key?'active':''}"><span class="sym">${ic}</span>${label}</button>`).join('');mobileNav.innerHTML=tabs.map(([key,ic,label])=>`<button data-action="tab" data-tab="${key}" class="${tab===key?'active':''}"><span class="sym">${ic}</span><span>${label}</span></button>`).join('')}
  function render(){renderNav();let d=tabs.find(x=>x[0]===tab);document.getElementById('page-title').textContent=d[2];const subs={dashboard:'လုပ်ငန်းနှင့် ဝင်ငွေအခြေအနေ',transactions:'ဝင်ငွေ • ထွက်ငွေ • ငွေပေးချေမှုနည်းလမ်း',visits:'လာရောက်သူများ၏ ဝင်ချိန်၊ ထွက်ချိန်',bookings:'ကြိုတင်စာရင်းနှင့် ငွေလက်ခံမှတ်တမ်း',appointments:'နေ့ရက်၊ အချိန်၊ အကြောင်းအရာ',items:'ပစ္စည်း အဝင် / အထွက် / လက်ကျန်',reports:'အလိုအလျောက် ငွေစာရင်း၊ အမြတ်နှင့် CSV',settings:'Backup • Restore • အသုံးပြုပုံ'};document.getElementById('page-subtitle').textContent=subs[tab];document.getElementById('today-label').textContent=dateView(todayISO());content.innerHTML=({dashboard:renderDashboard,transactions:renderTransactions,visits:renderVisits,bookings:renderBookings,appointments:renderAppointments,items:renderItems,reports:renderReports,settings:renderSettings}[tab])()}
  function renderDashboard(){const today=summarize(byDate(todayISO())),month=summarize(byMonth(todayISO().slice(0,7)));let latest=sortByDate(db.transactions).slice(0,5),cnt={visits:db.visits.filter(x=>x.date===todayISO()).length,bookings:db.bookings.filter(x=>x.date===todayISO()&&x.status!=='cancelled').length,appointments:db.appointments.filter(x=>x.date===todayISO()&&x.status!=='cancelled').length,pending:db.bookings.filter(x=>x.status==='pending').length};let days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-6+i);let date=isoDate(d);return {d:date,s:summarize(byDate(date))}}),max=Math.max(1,...days.flatMap(x=>[x.s.income,x.s.expense]));let methodRows=methods.map(m=>{let all=byMonth(todayISO().slice(0,7)).filter(x=>x.method===m),s=summarize(all);return `<div class="method-row"><span><i class="method-dot" style="background:${methodColors[m]}"></i>${safe(m)}</span><span>${money(s.income)} <span class="muted">/</span> ${money(s.expense)}</span></div>`}).join('');return `
      <div class="grid kpis"><div class="card kpi"><div class="decor"></div><div class="klabel">ယနေ့ ဝင်ငွေ</div><div class="value positive">${cash(today.income)} <span class="unit">Ks</span></div><div class="foot">ငွေလက်ခံထားသည့် စုစုပေါင်း</div></div><div class="card kpi"><div class="decor"></div><div class="klabel">ယနေ့ ထွက်ငွေ</div><div class="value negative">${cash(today.expense)} <span class="unit">Ks</span></div><div class="foot">အသုံးစရိတ် စုစုပေါင်း</div></div><div class="card kpi profit"><div class="decor"></div><div class="klabel">ယနေ့ အမြတ် / အသားတင်</div><div class="value ${today.profit>=0?'positive':'negative'}">${cash(today.profit)} <span class="unit">Ks</span></div><div class="foot">ဝင်ငွေ − ထွက်ငွေ</div></div></div>
      ${heading('ယနေ့ လုပ်ငန်းအခြေအနေ')}<div class="summary-list"><div class="summary-mini"><strong>${cnt.visits}</strong><span>လာရောက်သူ</span></div><div class="summary-mini"><strong>${cnt.bookings}</strong><span>ယနေ့ Booking</span></div><div class="summary-mini"><strong>${cnt.appointments}</strong><span>ယနေ့ ရက်ချိန်း</span></div><div class="summary-mini"><strong>${cnt.pending}</strong><span>စောင့်ဆိုင်း Booking</span></div></div>
      ${heading('လွယ်ကူစွာ မှတ်တမ်းသွင်း')}<div class="quick">${addButton('transactions','＋ ငွေစာရင်း')}${addButton('visits','＋ လူအဝင်အထွက်')}${addButton('bookings','＋ Booking')}${addButton('appointments','＋ ရက်ချိန်း')}${addButton('items','＋ ပစ္စည်း')}</div>
      ${heading('ငွေစာရင်း သုံးသပ်ချက်','<span class="muted" style="font-size:11px">ယခုလ</span>')}<div class="split"><div class="card"><h3 class="panel-title">လွန်ခဲ့သော ၇ ရက် · ဝင်ငွေ / ထွက်ငွေ</h3><div class="bars">${days.map(x=>`<div class="bar-col"><div class="bar-stack"><div class="bar-in" title="ဝင်ငွေ ${money(x.s.income)}" style="height:${x.s.income?Math.max(3,Math.round(x.s.income/max*100)):2}%"></div><div class="bar-out" title="ထွက်ငွေ ${money(x.s.expense)}" style="height:${x.s.expense?Math.max(3,Math.round(x.s.expense/max*100)):2}%"></div></div><span class="bar-lbl">${x.d.slice(8)}</span></div>`).join('')}</div><div class="legend"><span><b style="background:#3caa90"></b>ဝင်ငွေ</span><span><b style="background:#ed9b7e"></b>ထွက်ငွေ</span></div></div><div class="card"><h3 class="panel-title">ယခုလ Payment နည်းလမ်းအလိုက်</h3>${methodRows}<div class="method-row"><b>လအလိုက် အသားတင်</b><b class="${month.profit>=0?'positive':'negative'}">${signed(month.profit)}</b></div></div></div>
      ${heading('နောက်ဆုံး ငွေစာရင်း',`<button class="btn small outline" data-action="tab" data-tab="transactions">အားလုံးကြည့်</button>`)}${transactionTable(latest)}<p class="small-note">* အသားတင်လက်ကျန် = မှတ်တမ်းသွင်းထားသော ဝင်ငွေ − ထွက်ငွေ။ Booking တင်ရုံဖြင့် ငွေဝင်အဖြစ် မတွက်ပါ။</p>`}
  function transactionTable(arr){return `<div class="table-wrap"><table><thead><tr><th>နေ့ / အချိန်</th><th>အမျိုးအစား</th><th>အမည် / အကြောင်းအရာ</th><th>Payment</th><th class="amount">ပမာဏ</th><th></th></tr></thead><tbody>${arr.length?arr.map(r=>`<tr><td>${dateView(r.date)}<span class="sub">${safe(r.time||'')}</span></td><td><span class="pill ${r.type==='income'?'green':'red'}">${r.type==='income'?'ဝင်ငွေ':'ထွက်ငွေ'}</span><span class="sub">${safe(r.category||'')}</span></td><td>${safe(r.person||'—')}<span class="sub">${safe(r.details||'')}</span></td><td>${safe(r.method||'—')}</td><td class="amount ${r.type==='income'?'positive':'negative'}">${r.type==='income'?'+':'−'}${cash(r.amount)}</td><td>${buttonActions('transactions',r)}</td></tr>`).join(''):noRows(6)}</tbody></table></div>`}
  function renderTransactions(){let list=sortByDate(db.transactions.filter(x=>(!filterDate||x.date===filterDate)&&(txType==='all'||x.type===txType))),s=summarize(list);return `${heading('ဝင်ငွေ / ထွက်ငွေ စာရင်း',addButton('transactions'))}<div class="filter-row"><input class="field-input" aria-label="ရက်စွဲ ရွေးချယ်ရန်" type="date" id="tx-date" value="${safe(filterDate)}"><button class="btn small outline" data-action="all-dates">ရက်အားလုံး</button><select class="field-select" id="tx-type" aria-label="အမျိုးအစား"><option value="all" ${txType==='all'?'selected':''}>အားလုံး</option><option value="income" ${txType==='income'?'selected':''}>ဝင်ငွေ</option><option value="expense" ${txType==='expense'?'selected':''}>ထွက်ငွေ</option></select></div><div class="grid kpis"><div class="card kpi"><div class="klabel">ရွေးထားသော ဝင်ငွေ</div><div class="value positive">${cash(s.income)} <span class="unit">Ks</span></div></div><div class="card kpi"><div class="klabel">ရွေးထားသော ထွက်ငွေ</div><div class="value negative">${cash(s.expense)} <span class="unit">Ks</span></div></div><div class="card kpi profit"><div class="klabel">အသားတင်</div><div class="value ${s.profit>=0?'positive':'negative'}">${cash(s.profit)} <span class="unit">Ks</span></div></div></div>${heading('စာရင်းသွင်းထားသော အချက်အလက်',`<span class="muted" style="font-size:11px">${list.length} စာရင်း</span>`)}${transactionTable(list)}<p class="small-note">* ရက်စွဲနှင့် Filter ပြောင်းလျှင် ကိန်းဂဏန်းများ အလိုအလျောက် ပြောင်းလဲတွက်ချက်ပါမည်။</p>`}
  function renderVisits(){let list=sortByDate(db.visits);return `${heading('လူစာရင်း အဝင် / အထွက်',addButton('visits'))}<div class="notice">ဝင်ချိန် / ထွက်ချိန်ကို ကိုယ်တိုင်သွင်းနိုင်ပြီး၊ “ယခု ထွက်” ကိုနှိပ်လျှင် လက်ရှိအချိန်ဖြင့် အလိုအလျောက် မှတ်တမ်းတင်ပါမည်။</div>${heading('လာရောက်သူ မှတ်တမ်း')}<div class="table-wrap"><table><thead><tr><th>နေ့ရက်</th><th>အမည်</th><th>အဝင်</th><th>အထွက်</th><th>လာရောက်ရခြင်း</th><th></th></tr></thead><tbody>${list.length?list.map(r=>`<tr><td>${dateView(r.date)}</td><td>${safe(r.person)}<span class="sub">${safe(r.phone||'')}</span></td><td>${safe(r.timeIn||'—')}</td><td>${safe(r.timeOut||'—')}</td><td>${safe(r.purpose||'—')}<span class="sub">${safe(r.note||'')}</span></td><td><div class="actions">${!r.timeOut?`<button class="btn small mint" data-action="checkout" data-id="${safe(r.id)}">ယခု ထွက်</button>`:''}${buttonActions('visits',r)}</div></td></tr>`).join(''):noRows(6)}</tbody></table></div>`}
  function paidOf(bookingId){return db.transactions.filter(t=>t.bookingId===bookingId&&t.type==='income').reduce((s,t)=>s+number(t.amount),0)}
  function renderBookings(){let list=sortByDate(db.bookings);return `${heading('Booking စာရင်း',addButton('bookings'))}<div class="notice">Booking ဖန်တီးခြင်းသည် ဝင်ငွေမဟုတ်သေးပါ။ “ငွေလက်ခံ” မှ အမှန်တကယ် ရရှိသည့်ငွေကို သွင်းမှသာ ဝင်ငွေစာရင်းထဲ ပါဝင်ပါမည်။</div>${heading('Booking အချက်အလက်')}<div class="table-wrap"><table><thead><tr><th>နေ့ / အချိန်</th><th>Customer</th><th>ဝန်ဆောင်မှု</th><th>အခကြေးငွေ</th><th>ငွေလက်ခံပြီး</th><th>အခြေအနေ</th><th></th></tr></thead><tbody>${list.length?list.map(r=>{let paid=paidOf(r.id),due=number(r.fee)-paid;return `<tr><td>${dateView(r.date)}<span class="sub">${safe(r.time||'')}</span></td><td>${safe(r.person)}<span class="sub">${safe(r.phone||'')}</span></td><td>${safe(r.service||'—')}<span class="sub">${safe(r.notes||'')}</span></td><td class="amount">${money(r.fee)}</td><td class="amount">${money(paid)}<span class="sub">ကျန် ${money(Math.max(0,due))}</span></td><td>${badge(r.status)}</td><td><div class="actions"><button class="btn small mint" data-action="book-pay" data-id="${safe(r.id)}" ${r.status==='cancelled'||(number(r.fee)>0&&due<=0)?'disabled':''}>ငွေလက်ခံ</button>${buttonActions('bookings',r)}</div></td></tr>`}).join(''):noRows(7)}</tbody></table></div>`}
  function renderAppointments(){let list=sortByDate(db.appointments);return `${heading('ရက်ချိန်း မှတ်တမ်း',addButton('appointments'))}<div class="table-wrap"><table><thead><tr><th>ရက် / အချိန်</th><th>အမည်</th><th>အကြောင်းအရာ</th><th>အခြေအနေ</th><th>မှတ်ချက်</th><th></th></tr></thead><tbody>${list.length?list.map(r=>`<tr><td>${dateView(r.date)}<span class="sub">${safe(r.time||'')}</span></td><td>${safe(r.person)}<span class="sub">${safe(r.phone||'')}</span></td><td>${safe(r.subject||'—')}</td><td>${badge(r.status)}</td><td>${safe(r.note||'—')}</td><td>${buttonActions('appointments',r)}</td></tr>`).join(''):noRows(6)}</tbody></table></div>`}
  function stockEntries(){let map=new Map();for(const r of [...db.items].sort((a,b)=>(a.date||'').localeCompare(b.date||''))){let key=(r.name||'').trim().toLocaleLowerCase()+'|'+(r.unit||'');let v=map.get(key)||{name:r.name,unit:r.unit,count:0};v.count+=(r.movement==='in'?1:-1)*number(r.qty);map.set(key,v)}return Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name))}
  function renderItems(){let list=sortByDate(db.items),stocks=stockEntries();return `${heading('အထွေထွေ ပစ္စည်းစာရင်း',addButton('items'))}<div class="notice warning">ပစ္စည်းဝယ်ယူမှု၏ ငွေကုန်ကျစရိတ်ကို “ငွေစာရင်း → ထွက်ငွေ” တွင် သီးသန့်မှတ်တမ်းသွင်းပါ။ ဤနေရာသည် ပစ္စည်း အရေအတွက်အတွက်သာ ဖြစ်ပြီး ငွေစာရင်းကို နှစ်ခါမတွက်ပါ။</div>${heading('ပစ္စည်း လက်ကျန်')}<div class="stock-grid">${stocks.length?stocks.map(s=>`<div class="stock-item"><b>${safe(s.name)}</b><strong class="${s.count<0?'negative':''}">${cash(s.count)}</strong><small>${safe(s.unit||'ခု')} လက်ကျန်</small></div>`).join(''):'<div class="small-note">ပစ္စည်းစာရင်း မရှိသေးပါ။</div>'}</div>${heading('အဝင် / အထွက် မှတ်တမ်း')}<div class="table-wrap"><table><thead><tr><th>နေ့ရက်</th><th>ပစ္စည်းအမည်</th><th>အဝင် / အထွက်</th><th>အရေအတွက်</th><th>မှတ်ချက်</th><th></th></tr></thead><tbody>${list.length?list.map(r=>`<tr><td>${dateView(r.date)}</td><td>${safe(r.name)}</td><td>${badge(r.movement)}</td><td><b>${r.movement==='in'?'+':'−'}${cash(r.qty)} ${safe(r.unit||'ခု')}</b></td><td>${safe(r.note||'—')}</td><td>${buttonActions('items',r)}</td></tr>`).join(''):noRows(6)}</tbody></table></div>`}
  function renderReports(){let rows=byMonth(filterMonth),s=summarize(rows),total=summarize(db.transactions),daily=new Map(),cats=new Map();for(const r of rows){let d=daily.get(r.date)||{date:r.date,income:0,expense:0};d[r.type]+=number(r.amount);daily.set(r.date,d);let key=(r.type==='income'?'ဝင်ငွေ • ':'ထွက်ငွေ • ')+(r.category||'အခြား');cats.set(key,(cats.get(key)||0)+number(r.amount))}return `${heading('လအလိုက် အစီရင်ခံစာ',`<button class="btn small outline" data-action="print">⎙ Print / PDF</button>`)}<div class="filter-row"><label for="report-month" class="small-note">လ ရွေးပါ</label><input class="field-input" type="month" id="report-month" value="${safe(filterMonth)}"><button class="btn small mint" data-action="export-csv">CSV စာရင်း Export</button></div><div class="grid kpis"><div class="card kpi"><div class="klabel">${safe(filterMonth)} · ဝင်ငွေ</div><div class="value positive">${cash(s.income)} <span class="unit">Ks</span></div></div><div class="card kpi"><div class="klabel">ထွက်ငွေ</div><div class="value negative">${cash(s.expense)} <span class="unit">Ks</span></div></div><div class="card kpi profit"><div class="klabel">လစဉ် အမြတ် / အသားတင်</div><div class="value ${s.profit>=0?'positive':'negative'}">${cash(s.profit)} <span class="unit">Ks</span></div></div></div>${heading('နေ့အလိုက် ဝင်ငွေ / ထွက်ငွေ')}<div class="table-wrap"><table class="summary-table"><thead><tr><th>ရက်စွဲ</th><th class="amount">ဝင်ငွေ</th><th class="amount">ထွက်ငွေ</th><th class="amount">လက်ကျန်</th></tr></thead><tbody>${daily.size?[...daily.values()].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${dateView(x.date)}</td><td class="amount positive">${money(x.income)}</td><td class="amount negative">${money(x.expense)}</td><td class="amount ${x.income-x.expense>=0?'positive':'negative'}">${signed(x.income-x.expense)}</td></tr>`).join(''):noRows(4)}</tbody></table></div>${heading('အမျိုးအစားအလိုက် စုစုပေါင်း')}<div class="report-box"><div class="card">${cats.size?[...cats].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="method-row"><span>${safe(k)}</span><strong>${money(v)}</strong></div>`).join(''):'<p class="small-note">စာရင်းမရှိပါ။</p>'}</div><div class="card"><h3 class="panel-title">လက်ရှိမှတ်တမ်း အားလုံး (All-time)</h3><div class="method-row"><span>ဝင်ငွေ</span><strong class="positive">${money(total.income)}</strong></div><div class="method-row"><span>ထွက်ငွေ</span><strong class="negative">${money(total.expense)}</strong></div><div class="method-row"><b>အသားတင်</b><b class="${total.profit>=0?'positive':'negative'}">${signed(total.profit)}</b></div><p class="small-note">ဝန်ဆောင်မှုအတွက် ရသေးသော Booking ကျန်ငွေကို မတွက်ထားပါ။</p></div></div><p class="small-note">* ဤအစီရင်ခံစာသည် cash-basis ဝင်ငွေ − ထွက်ငွေ လက်ကျန်ဖြစ်ပြီး အခွန်/အကြွေး/ပိုင်ဆိုင်မှုတန်ဖိုးတို့ပါဝင်သည့် စာရင်းကိုင်အမြတ် မဟုတ်ပါ။</p>`}
  function renderSettings(){return `${heading('Data Backup & Restore')}<div class="split"><div class="card"><h3 class="panel-title">အချက်အလက် သိမ်းဆည်းခြင်း</h3><p class="small-note">ဒေတာများကို လက်ရှိ Browser ၏ Local Storage ထဲတွင်သာ သိမ်းထားပါသည်။ ဖုန်းအသစ်၊ Browser အသစ်သို့ အလိုအလျောက် မကူးပါ။ Browser data ရှင်းလင်းလျှင် ဆုံးရှုံးနိုင်ပါသည်။</p><div class="quick"><button class="btn mint" data-action="backup">↓ JSON Backup</button><button class="btn outline" data-action="import">↑ JSON Restore</button></div><p class="small-note">အကြံပြုချက် — နေ့တိုင်း သို့မဟုတ် အပတ်စဉ် JSON Backup ကို Files / Drive ထဲမှာ သိမ်းပါ။ Restore သည် ယခင်ဒေတာကို အစားထိုးပါမည်။</p></div><div class="card"><h3 class="panel-title">စာရင်း Export</h3><p class="small-note">ငွေစာရင်းများကို Excel / Google Sheets ဖြင့် ဖတ်နိုင်သော CSV ဖိုင်အဖြစ် ထုတ်နိုင်ပါသည်။</p><button class="btn secondary" data-action="export-csv">↓ CSV Download (အားလုံး)</button><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><button class="btn small danger" data-action="reset">ဒေတာအားလုံး ဖျက်မည်</button></div></div>${heading('အသုံးပြုပုံ')}<div class="card"><p class="small-note"><b>၁။ ငွေဝင် / ငွေထွက်</b> — ငွေစာရင်းသွင်းပြီး Cash, KPay, Wave, AYA Pay ကိုရွေးပါ။ အမြတ်/အသားတင်လက်ကျန် အလိုအလျောက်တွက်မည်။<br><b>၂။ Booking</b> — ကြိုတင်စာရင်းတင်ပြီး “ငွေလက်ခံ” မှ Deposit / လက်ကျန်ငွေကို သွင်းပါ။<br><b>၃။ ရက်ချိန်း</b> — နေ့ရက်၊ အချိန်၊ လူနာမည်၊ အကြောင်းအရာ၊ အခြေအနေ မှတ်ပါ။<br><b>၄။ လူစာရင်း</b> — ဝင်ချိန်၊ ထွက်ချိန် ကို သွင်းပါ။<br><b>၅။ ပစ္စည်း</b> — အရေအတွက် အဝင်/အထွက်သာ ရေတွက်သည်။ ကုန်ကျစရိတ်ကို ငွေစာရင်းထဲ သွင်းပါ။<br><b>၆။ အစီရင်ခံစာ</b> — လအလိုက် စုစုပေါင်းနှင့် CSV ကိုယူပါ။</p></div><p class="small-note">အင်တာနက်မလိုအပ်ဘဲ အသုံးပြုနိုင်ရန် ဒီ App ကို PWA အဖြစ် ထည့်ထားနိုင်သည်။ ပထမအကြိမ် ဝဘ်လိပ်စာမှ ဖွင့်ရပြီးနောက် “Add to Home screen / Install app” လုပ်နိုင်ပါသည်။</p>`}

  function ff(label,name,type='text',value='',opts={}){let attr=`id="f-${name}" name="${name}" ${opts.required?'required':''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} ${opts.placeholder?`placeholder="${safe(opts.placeholder)}"`:''}`,input=opts.options?`<select ${attr}>${opts.options.map(z=>Array.isArray(z)?`<option value="${safe(z[0])}" ${z[0]==value?'selected':''}>${safe(z[1])}</option>`:`<option value="${safe(z)}" ${z==value?'selected':''}>${safe(z)}</option>`).join('')}</select>`:type==='textarea'?`<textarea ${attr}>${safe(value)}</textarea>`:`<input ${attr} type="${type}" value="${safe(value)}">`;return `<div class="form-field ${opts.wide?'wide':''}"><label for="f-${name}">${label}${opts.required?' *':''}</label>${input}${opts.hint?`<div class="hint">${safe(opts.hint)}</div>`:''}</div>`}
  function openModal(kind,record=null,prefill={}){modalKind=kind;editId=record?.id||null;formPrefill=prefill;const v={date:todayISO(),time:nowHHMM(),timeIn:nowHHMM(),status:kind==='bookings'?'pending':'scheduled',type:'income',method:'Cash',movement:'in',unit:'ခု',...record,...prefill};let out='';if(kind==='transactions'){out+=ff('ရက်စွဲ','date','date',v.date,{required:true})+ff('အချိန်','time','time',v.time,{required:true})+ff('စာရင်းအမျိုးအစား','type','select',v.type,{required:true,options:[['income','ဝင်ငွေ (+)'],['expense','ထွက်ငွေ (−)']]})+ff('ပမာဏ (ကျပ်)','amount','number',v.amount??'',{required:true,min:1,step:'1'})+ff('Payment နည်းလမ်း','method','select',v.method,{required:true,options:methods})+ff('အမျိုးအစား','category','select',v.category||'ဗေဒင်ဝန်ဆောင်မှု',{options:['ဗေဒင်ဝန်ဆောင်မှု','Booking / Deposit','အခြား ဝင်ငွေ','ပစ္စည်းဝယ်','ငှားရမ်းခ','မီး/ရေ/အင်တာနက်','ဝန်ထမ်းလစာ','သယ်ယူပို့ဆောင်','အခြား ထွက်ငွေ']})+ff('နာမည် / ဆက်သွယ်သူ','person','text',v.person||'',{placeholder:'ဧည့်သည်အမည်'})+ff('အသေးစိတ်','details','textarea',v.details||'',{wide:true});if(db.bookings.length){let bks=[['','Booking မချိတ်ဆက်ပါ'],...db.bookings.map(b=>[b.id,`${b.person} · ${dateView(b.date)} · ${b.service||'Booking'}`])];out+=ff('ချိတ်ဆက်ထားသော Booking','bookingId','select',v.bookingId||'',{options:bks,wide:true,hint:'Booking နှင့် ချိတ်ဆက်ထားသည့် ဝင်ငွေကို Booking ထဲတွင် လက်ခံပြီးပမာဏအဖြစ် ပြပါမည်။'})}}
    if(kind==='visits'){out+=ff('ရက်စွဲ','date','date',v.date,{required:true})+ff('လူနာမည်','person','text',v.person||'',{required:true})+ff('ဖုန်းနံပါတ်','phone','tel',v.phone||'')+ff('အဝင်ချိန်','timeIn','time',v.timeIn||'',{required:true})+ff('အထွက်ချိန်','timeOut','time',v.timeOut||'')+ff('လာရောက်ရခြင်း','purpose','text',v.purpose||'')+ff('မှတ်ချက်','note','textarea',v.note||'',{wide:true})}
    if(kind==='bookings'){out+=ff('Booking နေ့ရက်','date','date',v.date,{required:true})+ff('Booking အချိန်','time','time',v.time,{required:true})+ff('Customer အမည်','person','text',v.person||'',{required:true})+ff('ဖုန်းနံပါတ်','phone','tel',v.phone||'')+ff('ဝန်ဆောင်မှု','service','text',v.service||'',{required:true,placeholder:'ဗေဒင် / အကြံပေး'})+ff('စုစုပေါင်း ကျသင့်ငွေ (ကျပ်)','fee','number',v.fee??0,{min:0,step:'1',required:true})+ff('အခြေအနေ','status','select',v.status,{options:[['pending','စောင့်ဆိုင်း'],['confirmed','အတည်ပြု'],['completed','ပြီးဆုံး'],['cancelled','ဖျက်သိမ်း']]})+ff('အသေးစိတ်','notes','textarea',v.notes||'',{wide:true})}

  function onSubmit(e){e.preventDefault();if(!modalKind)return;const data=Object.fromEntries(new FormData(form).entries());for(let k in data)if(typeof data[k]==='string')data[k]=data[k].trim();if(modalKind==='transactions'){data.amount=number(data.amount);if(!Number.isSafeInteger(data.amount)||data.amount<=0){alert('ငွေပမာဏကို သုညထက်ကြီးသော ကိန်းပြည့်ဖြင့် ဖြည့်ပါ။');return}if(data.bookingId&&(!db.bookings.find(x=>x.id===data.bookingId)||data.type!=='income')){alert('Booking နှင့် ဝင်ငွေစာရင်းသာ ချိတ်ဆက်ပါ။');return}}
    if(modalKind==='bookings'){data.fee=number(data.fee);if(!Number.isSafeInteger(data.fee)||data.fee<0){alert('ကျသင့်ငွေကို သုည သို့မဟုတ် အပေါင်းကိန်းဖြင့် ဖြည့်ပါ။');return}}
    if(modalKind==='items'){data.qty=number(data.qty);if(!Number.isSafeInteger(data.qty)||data.qty<=0){alert('ပစ္စည်း အရေအတွက်ကို အပေါင်းကိန်းပြည့်ဖြင့် ဖြည့်ပါ။');return}}
    if(modalKind==='visits'&&data.timeOut&&data.timeIn&&data.timeOut<data.timeIn){if(!confirm('ထွက်ချိန်က ဝင်ချိန်ထက် စောနေပါသည်။ ညလုံးကျော်သွားသည့် အခြေအနေဖြစ်ပါသလား?'))return}
    const arr=db[modalKind],i=editId?arr.findIndex(x=>x.id===editId):-1,previous=i>=0?{...arr[i]}:null,record={...(i!==-1?arr[i]:{}),...data,id:i!==-1?editId:id()};if(i>=0)arr[i]=record;else arr.push(record);if(!save()){if(i>=0)arr[i]=previous;else arr.pop();return}closeModal();render();notice(i>=0?'ပြင်ဆင်ပြီးပါပြီ':'သိမ်းဆည်းပြီးပါပြီ')}
  function remove(kind,uid){const arr=db[kind],r=arr.find(x=>x.id===uid);if(!r)return;let extra=kind==='bookings'?'\nBooking ကို ဖျက်မည်ဖြစ်သော်လည်း ငွေစာရင်းထဲမှ လက်ခံငွေများကို မဖျက်ပါ။':'';if(!confirm('ဤမှတ်တမ်းကို ဖျက်မည်လား?'+extra))return;db[kind]=arr.filter(x=>x.id!==uid);if(kind==='bookings')for(let t of db.transactions)if(t.bookingId===uid)t.bookingId='';save();render();notice('မှတ်တမ်း ဖျက်ပြီးပါပြီ')}

  function exportCSV(){let list=tab==='reports'?byMonth(filterMonth):db.transactions,heads=['Date','Time','Type','Amount_MMK','Payment_Method','Category','Customer','Details','Booking_ID'],rows=list.map(r=>[r.date,r.time,r.type,r.amount,r.method,r.category,r.person,r.details,r.bookingId]);download(`Daily-Astrology-InCome-${tab==='reports'?filterMonth:'All'}-money.csv`,'\uFEFF'+[heads,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notice('CSV ဖိုင် ထုတ်ပြီးပါပြီ')}
  function validateImport(d){if(!d||typeof d!=='object')return false;return ['transactions','visits','bookings','appointments','items'].every(k=>Array.isArray(d[k])&&d[k].every(x=>x&&typeof x==='object'&&!Array.isArray(x))) }
  async function importFile(f){if(!f)return;try{if(f.size>12*1024*1024)throw Error('Backup ဖိုင် 12MB ထက်ကြီးနေပါသည်။');let data=JSON.parse(await f.text());if(!validateImport(data))throw Error('မှန်ကန်သော Daily Astrology InCome Backup မဟုတ်ပါ။');if(!confirm(`Backup Restore ပြုလုပ်မည်လား?\nလက်ရှိဒေတာ အားလုံးကို အစားထိုးပါမည်။\nငွေစာရင်း ${data.transactions.length} ခု၊ Booking ${data.bookings.length} ခု ပါဝင်သည်။`))return;db={...emptyDB(),...Object.fromEntries(['transactions','visits','bookings','appointments','items'].map(k=>[k,data[k]]))};save();render();notice('Backup ပြန်သွင်းပြီးပါပြီ')}catch(e){alert('Restore မအောင်မြင်ပါ။ '+e.message)}finally{document.getElementById('import-file').value=''}}
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,k=btn.dataset.kind,uid=btn.dataset.id;if(a==='tab')setTab(btn.dataset.tab);else if(a==='open-add')openModal(k);else if(a==='close-modal')closeModal();else if(a==='edit'){let r=db[k]?.find(x=>x.id===uid);if(r)openModal(k,r)}else if(a==='delete')remove(k,uid);else if(a==='checkout')checkout(uid);else if(a==='book-pay')bookPay(uid);else if(a==='all-dates'){filterDate='';render()}else if(a==='backup')backup();else if(a==='import')document.getElementById('import-file').click();else if(a==='export-csv')exportCSV();else if(a==='print')window.print();else if(a==='reset'){if(confirm('လက်ရှိ ဒေတာအားလုံးကို ဖျက်မည်လား? Backup ယူထားပါ။')&&confirm('သေချာပါသလား? ပြန်ယူ၍မရနိုင်ပါ။')){db=emptyDB();save();render();notice('ဒေတာအားလုံး ဖျက်ပြီးပါပြီ')}}});
  document.addEventListener('change',e=>{if(e.target.id==='tx-date'){filterDate=e.target.value;render()}else if(e.target.id==='tx-type'){txType=e.target.value;render()}else if(e.target.id==='report-month'){filterMonth=e.target.value||todayISO().slice(0,7);render()}});
  form.addEventListener('submit',onSubmit);document.getElementById('import-file').addEventListener('change',e=>importFile(e.target.files?.[0]));modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))closeModal()});window.addEventListener('storage',e=>{if(e.key===DB_KEY){db=loadDB();render()}});window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);if(tabs.some(x=>x[0]===h)&&h!==tab){tab=h;render()}});
  const h=location.hash.slice(1);if(tabs.some(x=>x[0]===h))tab=h;render();
  if('serviceWorker'in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
})();
</script>
